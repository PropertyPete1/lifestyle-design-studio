name: Long-form Probe (Phase 0)

# Phase 0 capability probes for the weekly long-form YouTube engine.
#
# No schedule — nothing here runs on its own. workflow_dispatch is the intended
# trigger, but GitHub only exposes that once the file is on the default branch,
# so while this lives on the feature branch the probes are driven by markers in
# the commit message:
#
#   [probe-youtube]   round-trip the Metricool youtubeData fields
#   [probe-assembly]  build and time a full long-form assembly (slow, ~hours)
#   [probe-visuals]   write three unrelated pillar topics with the REAL writer
#                     and report which segments asked for a visual, of what type
#
# Nothing in this workflow publishes. The Metricool probe creates drafts and
# deletes them in a finally block; no YouTube upload happens at this phase.
on:
  push:
    branches: [feat/youtube-longform, feat/yt-illustrated-broll]
    paths:
      - 'longform/**'
      - '.github/workflows/longform-probe.yml'
  workflow_dispatch:
    inputs:
      probe:
        description: 'Which probe to run'
        required: true
        default: 'assembly'
        type: choice
        options:
          - assembly
          - youtube-path
          - upload-preflight
          - multipart
          - media-delete
          - video-id
          - visual-intents
          - distribution-identity
          - thumbnail-candidates
          - all
      resolutions:
        description: 'Assembly probe: comma-separated (1080p, 4k, or "1080p,4k")'
        required: false
        default: '1080p'
        type: string
      target_minutes:
        description: 'Assembly probe: target video length in minutes'
        required: false
        default: '12'
        type: string
      media_path:
        description: 'media-delete only: path suffix to remove, e.g. 202608/abc123.mp4'
        required: false
        default: ''
        type: string

# Read-only against the repo. These probes report; they never commit.
permissions:
  contents: read

jobs:
  # Does the visual system work for any topic, or only the one it was built
  # against? Writes three pillar topics that share no vocabulary — a geographic
  # one, a numeric one and a comparison — with the real writer, and reports
  # which segments asked for a visual and of what type. A topic that produces
  # zero visuals is a finding to read, not a failed build.
  visual-intents:
    if: >-
      github.event.inputs.probe == 'visual-intents' || github.event.inputs.probe == 'all'
      || contains(github.event.head_commit.message, '[probe-visuals]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        working-directory: auto-poster
        run: npm ci --no-audit --no-fund
      - name: Write three topics and report their visual intents
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROBE_OUT_DIR: ${{ github.workspace }}/visual-intent-probe
        run: node longform/probe/probe-visual-intents.mjs
      - name: Upload rendered samples and scripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-intent-probe
          path: ${{ github.workspace }}/visual-intent-probe
          if-no-files-found: warn

  assembly:
    if: >-
      github.event.inputs.probe == 'assembly' || github.event.inputs.probe == 'all'
      || contains(github.event.head_commit.message, '[probe-assembly]')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Free disk headroom
        run: |
          # A 4K long-form assembly needs room for intermediates. The hosted
          # image ships ~30GB of toolchains we do not use here.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /
      - name: Run assembly probe
        working-directory: longform/probe
        env:
          PROBE_RESOLUTIONS: ${{ github.event.inputs.resolutions || (contains(github.event.head_commit.message, '[probe-4k]') && '1080p,4k') || '1080p' }}
          PROBE_TARGET_MINUTES: ${{ github.event.inputs.target_minutes || '12' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: node probe-assembly.mjs

  upload-preflight:
    if: >-
      github.event.inputs.probe == 'upload-preflight' || github.event.inputs.probe == 'all'
      || contains(github.event.head_commit.message, '[probe-preflight]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preflight — can a media upload reach a social account?
        working-directory: longform/probe
        env:
          METRICOOL_API_TOKEN: ${{ secrets.METRICOOL_API_TOKEN }}
          METRICOOL_BLOG_ID: ${{ secrets.METRICOOL_BLOG_ID }}
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
        run: node probe-upload-preflight.mjs

  # Moves real bytes into the media library and removes them again. Creates no
  # post and names no social account — see the preflight probe and the header of
  # probe-multipart-upload.mjs for why that is verified rather than assumed.
  multipart:
    if: >-
      github.event.inputs.probe == 'multipart'
      || contains(github.event.head_commit.message, '[probe-multipart]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Multipart round-trip
        working-directory: longform/probe
        env:
          # LIVE: moves ~12MB into the Metricool media library. Publishes
          # nothing, but cleanup is not guaranteed — the first run left an
          # orphaned file behind.
          I_UNDERSTAND_THIS_TOUCHES_LIVE: "yes"
          METRICOOL_API_TOKEN: ${{ secrets.METRICOOL_API_TOKEN }}
          METRICOOL_BLOG_ID: ${{ secrets.METRICOOL_BLOG_ID }}
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
        run: node probe-multipart-upload.mjs

  media-delete:
    if: github.event.inputs.probe == 'media-delete'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Delete a media-library file, and verify it is gone
        working-directory: longform/probe
        env:
          # LIVE: permanently deletes the named file from the Metricool media
          # library. Not reversible.
          I_UNDERSTAND_THIS_TOUCHES_LIVE: "yes"
          METRICOOL_API_TOKEN: ${{ secrets.METRICOOL_API_TOKEN }}
          METRICOOL_BLOG_ID: ${{ secrets.METRICOOL_BLOG_ID }}
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
          MEDIA_PATH: ${{ github.event.inputs.media_path }}
        run: node probe-media-delete.mjs "$MEDIA_PATH"

  # Can we learn the YouTube video id of something Metricool posted, without
  # calling the YouTube API? That decides whether thumbnails.set is buildable.
  # READ ONLY — reads scheduler posts that already exist, creates nothing.
  video-id:
    if: >-
      github.event.inputs.probe == 'video-id' || github.event.inputs.probe == 'all'
      || contains(github.event.head_commit.message, '[probe-video-id]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Is a YouTube video id reachable from Metricool?
        working-directory: longform/probe
        env:
          METRICOOL_API_TOKEN: ${{ secrets.METRICOOL_API_TOKEN }}
          METRICOOL_BLOG_ID: ${{ secrets.METRICOOL_BLOG_ID }}
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
        run: node probe-youtube-video-id.mjs

  # What would the face-thumbnail contest have made for an already-shipped
  # video? Recovers the takes from Drive, runs the exact production path
  # (frame sampling -> expression contest -> matte -> composite -> scoring),
  # and uploads all candidates + the winner + the contest report as an
  # artifact. Peter's acceptance test for the feature, runnable on demand.
  thumbnail-candidates:
    if: >-
      github.event.inputs.probe == 'thumbnail-candidates'
      || contains(github.event.head_commit.message, '[probe-thumbnail]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install ffmpeg & whisper
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install openai-whisper --quiet
      - name: Set up segmentation
        # Best-effort, same as the pipeline: a failed venv means the composites
        # use raw frames instead of mattes, and the report says so.
        run: |
          # mediapipe dlopens libEGL even headless — without it every matte
          # fails with "libEGL.so.1: cannot open shared object file".
          sudo apt-get install -y libegl1 libgl1 libgles2 || echo "::warning::GL libraries unavailable — mattes will fail"
          python3 -m venv /tmp/segenv || true
          /tmp/segenv/bin/pip install --quiet mediapipe opencv-python-headless || echo "::warning::segmentation setup failed — composites will use raw frames"
      - name: Install dependencies
        working-directory: auto-poster
        run: npm install
      - name: Run the thumbnail contest on recovered takes
        env:
          # Same mode as the pipeline, or recovery mismatches the takes.
          YT_NARRATION_MODE: peter
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_SEGMENTATION_PYTHON: /tmp/segenv/bin/python
          PROBE_OUT_DIR: ${{ github.workspace }}/thumbnail-probe
        run: node longform/probe/probe-thumbnail-candidates.mjs
      - name: Upload candidates and contest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thumbnail-candidates
          path: ${{ github.workspace }}/thumbnail-probe
          if-no-files-found: warn
          retention-days: 30

  # Whose channel does YT_REFRESH_TOKEN act as, and does it own the video
  # Metricool created? Built for video 1's first live sweep, which failed all
  # four distribution steps with visibility errors on a video that provably
  # exists. READ ONLY — lists channels/videos/playlists, changes nothing.
  distribution-identity:
    if: >-
      github.event.inputs.probe == 'distribution-identity'
      || contains(github.event.head_commit.message, '[probe-identity]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run distribution identity probe
        working-directory: longform/probe
        env:
          METRICOOL_API_TOKEN: ${{ secrets.METRICOOL_API_TOKEN }}
          METRICOOL_BLOG_ID: ${{ secrets.METRICOOL_BLOG_ID }}
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: node probe-distribution-identity.mjs

  youtube-path:
    if: >-
      github.event.inputs.probe == 'youtube-path' || github.event.inputs.probe == 'all'
      || contains(github.event.head_commit.message, '[probe-youtube]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run YouTube path probe
        working-directory: longform/probe
        env:
          # LIVE: creates draft posts in the Metricool scheduler to round-trip
          # the youtubeData fields. Deleted and verified on the way out.
          I_UNDERSTAND_THIS_TOUCHES_LIVE: "yes"
          METRICOOL_API_TOKEN: ${{ secrets.METRICOOL_API_TOKEN }}
          METRICOOL_BLOG_ID: ${{ secrets.METRICOOL_BLOG_ID }}
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: node probe-youtube-path.mjs

