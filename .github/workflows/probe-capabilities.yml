name: Capability Probe

# Phase 1 of the daily-carousel work: settle what Metricool's API actually
# supports before any feature code is written. Manual dispatch only — this is
# an investigation tool, not part of the posting pipeline.
#
# The probe creates DRAFT posts only (draft:true, autoPublish:false) and deletes
# every one of them before it exits. It publishes nothing.

# Dispatch-by-push: workflow_dispatch only works off the default branch, and this
# workflow deliberately never lands on main. Scoped to the probe's own files so
# it fires when the probe changes, not on every commit to the feature branch.
on:
  workflow_dispatch:
  push:
    paths:
      - "auto-poster/scripts/probe-capabilities.mjs"
      - "auto-poster/scripts/probe-capabilities-2.mjs"
      - ".github/workflows/probe-capabilities.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: auto-poster
        run: npm install
      - name: Run capability probe (round 2)
        working-directory: auto-poster
        env:
          METRICOOL_API_TOKEN: ${{ secrets.METRICOOL_API_TOKEN }}
          METRICOOL_BLOG_ID: ${{ secrets.METRICOOL_BLOG_ID }}
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
        run: node scripts/probe-capabilities-2.mjs
