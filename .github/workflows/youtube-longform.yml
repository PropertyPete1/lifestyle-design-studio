name: YouTube Long-form

# The weekly long-form cycle. It waits on a human twice — once to pick the
# topic, once to release the finished video — so it is built as a Monday job
# that asks, plus a polling job that advances whatever is ready.
#
# NOTHING HERE PUBLISHES. The brief and the recording kit are notifications;
# the publish step lands in a later PR behind an explicit approval.
#
# Both jobs share one concurrency group because both write yt-approvals.json,
# and a brief racing the pipeline over that file is the one way this design
# could lose a decision.
on:
  schedule:
    # Monday brief: 9:00 AM CT = 14:00 UTC, with a :30 backup like every other
    # job here. The brief job is idempotent — an unanswered brief blocks a
    # second one — so the backup cron cannot double-send.
    - cron: '0 14 * * 1'
    - cron: '30 14 * * 1'
    # Pipeline poll: 10:00 AM and 4:00 PM CT. Peter answers on his own time, so
    # this is about picking his answer up within hours rather than on a fixed
    # day. Most runs do nothing and exit clean.
    #
    # Each has a :30 backup, the same pattern post.yml uses on every slot.
    # GitHub deprioritises scheduled runs under load and this workflow gets hit
    # hard: measured delays of 55 minutes, 1h47, and once four hours. A poll
    # that is merely late is indistinguishable from a poll that never fired, and
    # the pipeline is idempotent — an acted request is skipped — so a second
    # trigger costs nothing and removes the ambiguity.
    - cron: '0 15 * * *'
    - cron: '30 15 * * *'
    - cron: '0 21 * * *'
    - cron: '30 21 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: true
        default: 'pipeline'
        type: choice
        options:
          - pipeline
          - brief
          - dry-run
          - send-test-approval
          - reoutline
          - resend-kit
      request_id:
        description: 'reoutline / resend-kit: the requestId to act on'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run (generate and print, send nothing)'
        required: false
        default: false
        type: boolean
      force:
        description: 'Brief only: send even if one is already unanswered'
        required: false
        default: false
        type: boolean
      dry_run_mode:
        description: 'Dry run: synthetic (no recordings needed) or recordings (a real folder)'
        required: false
        default: 'synthetic'
        type: choice
        options:
          - synthetic
          - recordings
      dry_run_request_id:
        description: 'Dry run in recordings mode: the requestId whose Drive folder to pull'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  brief:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'brief')
      || github.event.schedule == '0 14 * * 1'
      || github.event.schedule == '30 14 * * 1'
    runs-on: ubuntu-latest
    concurrency:
      group: youtube-longform-approvals
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: auto-poster
        run: npm install
      - name: Write the weekly brief
        id: run
        working-directory: auto-poster
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_WEBHOOK_SECRET: ${{ secrets.DASHBOARD_WEBHOOK_SECRET }}
        run: |
          if node src/yt-brief-main.js; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi
      - name: Commit approvals
        if: always()
        working-directory: auto-poster
        run: |
          git config user.name "Auto Poster Bot"
          git config user.email "bot@lifestyle-design.com"
          node merge-log-push.mjs YTBRIEF "${{ steps.run.outputs.success }}"

  pipeline:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'pipeline')
      || github.event.schedule == '0 15 * * *'
      || github.event.schedule == '30 15 * * *'
      || github.event.schedule == '0 21 * * *'
      || github.event.schedule == '30 21 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: youtube-longform-approvals
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install ffmpeg & whisper
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install openai-whisper --quiet
      - name: Free disk headroom
        run: |
          # A 12-minute render needs room for intermediates; the hosted image
          # ships ~30GB of toolchains this job never touches.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /
      - name: Install dependencies
        working-directory: auto-poster
        run: npm install
      - name: Advance the pipeline
        id: run
        working-directory: auto-poster
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          # Peter records every take, on-camera AND voiceover. The timeline
          # attaches his recording as narrationSource and generateNarration
          # skips any segment that has one, so nothing synthetic reaches the
          # render — which is what makes the disclosure unnecessary.
          YT_NARRATION_MODE: peter
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          METRICOOL_API_TOKEN: ${{ secrets.METRICOOL_API_TOKEN }}
          METRICOOL_BLOG_ID: ${{ secrets.METRICOOL_BLOG_ID }}
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
          YT_TEXT_NUMBER: ${{ secrets.YT_TEXT_NUMBER }}
          YT_LINKS_URL: ${{ secrets.YT_LINKS_URL }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_WEBHOOK_SECRET: ${{ secrets.DASHBOARD_WEBHOOK_SECRET }}
        run: |
          if node src/yt-pipeline-main.js; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi
      # A script held back for scoring below the bar is discarded, which also
      # discarded the only evidence of why. The draft and the critic's reasoning
      # land here instead. Nothing is written on a run that delivers a kit, so
      # this step is usually a no-op — hence if-no-files-found: ignore.
      - name: Upload held-back draft and critic feedback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: script-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/yt-diagnostics/
          if-no-files-found: ignore
          retention-days: 30
      - name: Commit approvals
        if: always()
        working-directory: auto-poster
        run: |
          git config user.name "Auto Poster Bot"
          git config user.email "bot@lifestyle-design.com"
          node merge-log-push.mjs YTPIPELINE "${{ steps.run.outputs.success }}"

  # THE GATE. Runs the whole build path — transcribe, match, plan, narrate,
  # render, cut Shorts — and cannot upload anything: no Metricool token is
  # passed to it, so the upload path has no credentials even if it were reached.
  #
  # Required before the first real Monday brief. The stages were built one at a
  # time and every seam between them is untested until something runs them in
  # order; two integration bugs were already found that way.
  dry-run:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Narrower than the workflow default. This job commits nothing — it renders
    # and throws the result away — so it has no reason to hold write access.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install ffmpeg, espeak & whisper
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg espeak
          pip install openai-whisper --quiet
      - name: Free disk headroom
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /
      - name: Install dependencies
        working-directory: auto-poster
        run: npm install
      - name: Fetch real recordings
        if: github.event.inputs.dry_run_mode == 'recordings'
        working-directory: auto-poster
        env:
          # MUST match the pipeline job. The dry run's whole purpose is to
          # predict what the real build will do, and takesToRecord() keys off
          # this — without it the dry run expects 12 on-camera takes while the
          # build expects all 36, so it passes with every voiceover take
          # missing and the build then fails. The header of takesToRecord
          # describes this exact disagreement happening once already.
          YT_NARRATION_MODE: peter
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          REQUEST_ID: ${{ github.event.inputs.dry_run_request_id }}
        run: node scripts/fetch-recordings.mjs "$REQUEST_ID" /tmp/dryrun-recordings
      - name: Run the dry run
        working-directory: auto-poster
        env:
          # DELIBERATELY NO METRICOOL CREDENTIALS. The dry run cannot upload
          # because it has nothing to upload with.
          # MUST match the pipeline job. The dry run's whole purpose is to
          # predict what the real build will do, and takesToRecord() keys off
          # this — without it the dry run expects 12 on-camera takes while the
          # build expects all 36, so it passes with every voiceover take
          # missing and the build then fails. The header of takesToRecord
          # describes this exact disagreement happening once already.
          YT_NARRATION_MODE: peter
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          MODE: ${{ github.event.inputs.dry_run_mode }}
        run: |
          if [ "$MODE" = "recordings" ]; then
            node scripts/dry-run-build.mjs --recordings /tmp/dryrun-recordings --broll /tmp/dryrun-broll
          else
            node scripts/dry-run-build.mjs --synthetic
          fi

  # Rewrite one approved request's outline under the current brief rules, without
  # making Peter pick a topic again. His decision, selection and notes are
  # preserved; only the selected candidate's outline changes. Publishes nothing.
  # Rebuild and re-send a recording kit for a request whose kit already went out
  # — after a narration-mode change, or when the first delivery had no card to
  # open. Clears no acted marker and changes no decision. Publishes nothing.
  resend-kit:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'resend-kit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: youtube-longform-approvals
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: auto-poster
        run: npm install
      - name: Rebuild and re-send the kit
        working-directory: auto-poster
        env:
          # LIVE: sends a real recording kit to the dashboard and Peter's inbox.
          I_UNDERSTAND_THIS_TOUCHES_LIVE: "yes"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          YT_NARRATION_MODE: peter
          # MUST match the pipeline job. The dry run's whole purpose is to
          # predict what the real build will do, and takesToRecord() keys off
          # this — without it the dry run expects 12 on-camera takes while the
          # build expects all 36, so it passes with every voiceover take
          # missing and the build then fails. The header of takesToRecord
          # describes this exact disagreement happening once already.
          YT_NARRATION_MODE: peter
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_WEBHOOK_SECRET: ${{ secrets.DASHBOARD_WEBHOOK_SECRET }}
          REQUEST_ID: ${{ github.event.inputs.request_id }}
        run: node scripts/resend-kit.mjs "$REQUEST_ID"

  reoutline:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'reoutline'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: youtube-longform-approvals
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: auto-poster
        run: npm install
      - name: Rewrite the outline
        id: run
        working-directory: auto-poster
        env:
          # LIVE: rewrites the stored outline on a real approval record and bills
          # the Anthropic API. The decision itself is never touched.
          I_UNDERSTAND_THIS_TOUCHES_LIVE: "yes"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REQUEST_ID: ${{ github.event.inputs.request_id }}
        run: |
          if node scripts/reoutline-request.mjs "$REQUEST_ID"; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi
      - name: Commit approvals
        if: always()
        working-directory: auto-poster
        run: |
          git config user.name "Auto Poster Bot"
          git config user.email "bot@lifestyle-design.com"
          node merge-log-push.mjs YTREOUTLINE "${{ steps.run.outputs.success }}"

  # One live topic_pick round-trip against the real dashboard, with candidates
  # prefixed [TEST]. Proves the approval endpoint, the push, and the decision
  # coming back with its selection field. Publishes nothing.
  send-test-approval:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'send-test-approval'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: youtube-longform-approvals
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: auto-poster
        run: npm install
      - name: Send the test approval
        id: send
        working-directory: auto-poster
        env:
          # LIVE: raises a real approval card on the dashboard and pushes a
          # notification to Peter. That is the whole point of this job, so the
          # acknowledgement is declared here rather than latched out.
          I_UNDERSTAND_THIS_TOUCHES_LIVE: "yes"
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_WEBHOOK_SECRET: ${{ secrets.DASHBOARD_WEBHOOK_SECRET }}
        run: |
          if node scripts/send-test-approval.mjs; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi
      - name: Commit the request
        if: always()
        working-directory: auto-poster
        run: |
          git config user.name "Auto Poster Bot"
          git config user.email "bot@lifestyle-design.com"
          node merge-log-push.mjs YTTEST "${{ steps.send.outputs.success }}"
