name: YouTube Long-form

# The weekly long-form cycle. It waits on a human twice — once to pick the
# topic, once to release the finished video — so it is built as a Monday job
# that asks, plus a polling job that advances whatever is ready.
#
# NOTHING HERE PUBLISHES. The brief and the recording kit are notifications;
# the publish step lands in a later PR behind an explicit approval.
#
# Both jobs share one concurrency group because both write yt-approvals.json,
# and a brief racing the pipeline over that file is the one way this design
# could lose a decision.
on:
  schedule:
    # Monday brief: 9:00 AM CT = 14:00 UTC, with a :30 backup like every other
    # job here. The brief job is idempotent — an unanswered brief blocks a
    # second one — so the backup cron cannot double-send.
    - cron: '0 14 * * 1'
    - cron: '30 14 * * 1'
    # Pipeline poll: 10:00 AM and 4:00 PM CT. Peter answers on his own time, so
    # this is about picking his answer up within hours rather than on a fixed
    # day. Most runs do nothing and exit clean.
    #
    # Each has a :30 backup, the same pattern post.yml uses on every slot.
    # GitHub deprioritises scheduled runs under load and this workflow gets hit
    # hard: measured delays of 55 minutes, 1h47, and once four hours. A poll
    # that is merely late is indistinguishable from a poll that never fired, and
    # the pipeline is idempotent — an acted request is skipped — so a second
    # trigger costs nothing and removes the ambiguity.
    - cron: '0 15 * * *'
    - cron: '30 15 * * *'
    - cron: '0 21 * * *'
    - cron: '30 21 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: true
        default: 'pipeline'
        type: choice
        options:
          - pipeline
          - brief
          - dry-run
          - send-test-approval
          - reoutline
          - resend-kit
          - teaser-backfill
          - stock-probe
      stock_queries:
        # Hand it the exact queries a past build used and read off which stage
        # each one dies at. Empty derives them from the current script instead.
        description: 'stock-probe: semicolon-separated queries (e.g. "hospital cluster; aerial suburban neighborhood"), or blank to use the current script'
        required: false
        default: ''
        type: string
      request_id:
        description: 'reoutline / resend-kit: the requestId to act on'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run (generate and print, send nothing)'
        required: false
        default: false
        type: boolean
      force:
        description: 'Brief only: send even if one is already unanswered'
        required: false
        default: false
        type: boolean
      dry_run_mode:
        description: 'Dry run: synthetic (no recordings needed) or recordings (a real folder)'
        required: false
        default: 'synthetic'
        type: choice
        options:
          - synthetic
          - recordings
      dry_run_request_id:
        description: 'Dry run in recordings mode: the requestId whose Drive folder to pull'
        required: false
        default: ''
        type: string
      piece_audio:
        # A BISECT HANDLE, not a setting anybody should need.
        #
        # On-camera pieces carry PCM so their joins do not accumulate an AAC
        # priming frame apiece (see PIECE_AUDIO in yt-oncamera-edit.js). If a
        # render ever comes out the wrong length again, "aac" reverts that one
        # change and keeps everything else, which answers in one run whether the
        # container is implicated. Default follows the code.
        description: 'On-camera piece audio codec — leave default unless bisecting a render-length defect'
        required: false
        default: 'default'
        type: choice
        options:
          - default
          - aac
          - pcm

permissions:
  contents: write

jobs:
  brief:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'brief')
      || github.event.schedule == '0 14 * * 1'
      || github.event.schedule == '30 14 * * 1'
    runs-on: ubuntu-latest
    concurrency:
      group: youtube-longform-approvals
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: auto-poster
        run: npm install
      - name: Write the weekly brief
        id: run
        working-directory: auto-poster
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_WEBHOOK_SECRET: ${{ secrets.DASHBOARD_WEBHOOK_SECRET }}
        run: |
          if node src/yt-brief-main.js; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi
      - name: Notify Peter on failure
        if: failure()
        working-directory: auto-poster
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_WEBHOOK_SECRET: ${{ secrets.DASHBOARD_WEBHOOK_SECRET }}
        run: node scripts/notify-run-failure.mjs brief
      - name: Commit approvals
        if: always()
        working-directory: auto-poster
        run: |
          git config user.name "Auto Poster Bot"
          git config user.email "bot@lifestyle-design.com"
          node merge-log-push.mjs YTBRIEF "${{ steps.run.outputs.success }}"

  pipeline:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'pipeline')
      || github.event.schedule == '0 15 * * *'
      || github.event.schedule == '30 15 * * *'
      || github.event.schedule == '0 21 * * *'
      || github.event.schedule == '30 21 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: youtube-longform-approvals
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install ffmpeg, tesseract & whisper
        run: |
          # tesseract is NOT optional tooling. The artifact QC gate reads the
          # on-screen text back off the rendered frames, and a missing OCR
          # binary fails the build rather than skipping the check — an overlay
          # nobody read is exactly the defect the gate exists to catch.
          sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr
          pip install openai-whisper --quiet
      - name: Free disk headroom
        run: |
          # A 12-minute render needs room for intermediates; the hosted image
          # ships ~30GB of toolchains this job never touches.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /
      - name: Set up PIP segmentation
        # Best-effort on purpose: if this fails, segmentationAvailable() reports
        # it and the build ships without the floating head — a degraded video,
        # never a dead job.
        run: |
          # mediapipe's segmenter dlopens libEGL even headless; the hosted
          # runner does not ship it, and its absence fails EVERY matte with
          # "libEGL.so.1: cannot open shared object file" (run 32298902764 —
          # which also means the PIP has been refusing itself on runners for
          # the same reason). Best-effort like the rest of this step.
          sudo apt-get install -y libegl1 libgl1 libgles2 || echo "::warning::GL libraries unavailable — mattes will fail"
          python3 -m venv /tmp/segenv || true
          /tmp/segenv/bin/pip install --quiet mediapipe opencv-python-headless || echo "::warning::segmentation setup failed — PIP will report unavailable"
      - name: Install dependencies
        working-directory: auto-poster
        run: npm install
      - name: Advance the pipeline
        id: run
        working-directory: auto-poster
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          # Peter records every take, on-camera AND voiceover. The timeline
          # attaches his recording as narrationSource and generateNarration
          # skips any segment that has one, so nothing synthetic reaches the
          # render — which is what makes the disclosure unnecessary.
          YT_NARRATION_MODE: peter
          YT_SEGMENTATION_PYTHON: /tmp/segenv/bin/python
          # The ONLY folder long-form footage may come from. Not a secret — a
          # Drive folder id, the same class of value as the city ids in drive.js.
          #
          # It is EMPTY and that is the designed steady state, not a setup step
          # anyone forgot: footage appears in long-form only when Peter puts
          # something here, and until then every segment is carried by an
          # animated graphic, kinetic typography or licensed stock. The reels
          # city folders are unreachable from this pipeline by construction —
          # their clips carry burned-in price and rate copy.
          YT_LONGFORM_BROLL_FOLDER: 18wMxgDnPm1HS10k9DTIc-1EijZXhq8RD
          # Empty unless a dispatch is bisecting, in which case yt-config's own
          # default applies — an unset variable and "default" are the same build.
          YT_PIECE_AUDIO: ${{ github.event.inputs.piece_audio == 'default' && '' || github.event.inputs.piece_audio }}
          # The stock layer. Without it searchPexels returns nothing, every
          # FOOTAGE intent falls to typography, and the build says so — a
          # degraded video, never a dead job.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          METRICOOL_API_TOKEN: ${{ secrets.METRICOOL_API_TOKEN }}
          METRICOOL_BLOG_ID: ${{ secrets.METRICOOL_BLOG_ID }}
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
          # The distribution sweep (thumbnails.set, playlists, the comment)
          # authenticates with this. It was set on the PROBE workflow and not
          # here — so on the job that actually runs the sweep, accessToken()
          # threw, the sweep skipped itself with a log warning nobody reads,
          # and distribution would silently never have happened. The exact
          # drift class the YT_NARRATION_MODE incident already demonstrated.
          # The YouTube token's OWN OAuth client (project "Youtube Auto Post" on
          # the channel-owning account). Falls back to the GOOGLE_ pair when unset;
          # a refresh token only works with the client that minted it.
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_TEXT_NUMBER: ${{ secrets.YT_TEXT_NUMBER }}
          YT_LINKS_URL: ${{ secrets.YT_LINKS_URL }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_WEBHOOK_SECRET: ${{ secrets.DASHBOARD_WEBHOOK_SECRET }}
        run: |
          if node src/yt-pipeline-main.js; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi
      # A script held back for scoring below the bar is discarded, which also
      # discarded the only evidence of why. The draft and the critic's reasoning
      # land here instead. Nothing is written on a run that delivers a kit, so
      # this step is usually a no-op — hence if-no-files-found: ignore.
      - name: Upload held-back draft and critic feedback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: script-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/yt-diagnostics/
          if-no-files-found: ignore
          retention-days: 30
      # THE RENDER THAT FAILED ITS OWN CHECKS, KEPT.
      #
      # On 2026-08-12 the artifact QC gate correctly refused a 20.5-minute
      # render of an 11.2-minute plan — and the file went with the runner, so
      # the only way to look at what it had already measured was another
      # fifty-five minute build. A gate that destroys its evidence converts a
      # diagnosable defect into a guess.
      #
      # `if: always()` rather than `if: failure()` on purpose: the gate can fail
      # the build in ways that do not mark THIS step's job as failed yet, and a
      # 180 MB upload that is usually a no-op costs nothing (if-no-files-found:
      # ignore). Peter can also watch a render the gate blocked — refusing to
      # card it and hiding it are different things.
      - name: Preserve a render that failed QC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failed-render-${{ github.run_id }}
          path: /tmp/yt-qc-failed/
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
      - name: Notify Peter on failure
        if: failure()
        working-directory: auto-poster
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_WEBHOOK_SECRET: ${{ secrets.DASHBOARD_WEBHOOK_SECRET }}
        run: node scripts/notify-run-failure.mjs pipeline
      - name: Commit approvals
        if: always()
        working-directory: auto-poster
        run: |
          git config user.name "Auto Poster Bot"
          git config user.email "bot@lifestyle-design.com"
          node merge-log-push.mjs YTPIPELINE "${{ steps.run.outputs.success }}"

  # THE GATE. Runs the whole build path — transcribe, match, plan, narrate,
  # render, cut Shorts — and cannot upload anything: no Metricool token is
  # passed to it, so the upload path has no credentials even if it were reached.
  #
  # Required before the first real Monday brief. The stages were built one at a
  # time and every seam between them is untested until something runs them in
  # order; two integration bugs were already found that way.
  dry-run:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Narrower than the workflow default. This job commits nothing — it renders
    # and throws the result away — so it has no reason to hold write access.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install ffmpeg, espeak, tesseract & whisper
        run: |
          # tesseract MUST match the pipeline job, for the same reason
          # YT_NARRATION_MODE does: this job exists to predict what the real
          # build will do, and it renders through the same artifact QC gate.
          # Without OCR here the dry run fails a check the real build would
          # pass, which is the drift that makes a dry run worthless.
          sudo apt-get update && sudo apt-get install -y ffmpeg espeak tesseract-ocr
          pip install openai-whisper --quiet
      - name: Free disk headroom
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /
      - name: Set up PIP segmentation
        # Best-effort on purpose: if this fails, segmentationAvailable() reports
        # it and the build ships without the floating head — a degraded video,
        # never a dead job.
        run: |
          # mediapipe's segmenter dlopens libEGL even headless; the hosted
          # runner does not ship it, and its absence fails EVERY matte with
          # "libEGL.so.1: cannot open shared object file" (run 32298902764 —
          # which also means the PIP has been refusing itself on runners for
          # the same reason). Best-effort like the rest of this step.
          sudo apt-get install -y libegl1 libgl1 libgles2 || echo "::warning::GL libraries unavailable — mattes will fail"
          python3 -m venv /tmp/segenv || true
          /tmp/segenv/bin/pip install --quiet mediapipe opencv-python-headless || echo "::warning::segmentation setup failed — PIP will report unavailable"
      - name: Install dependencies
        working-directory: auto-poster
        run: npm install
      - name: Fetch real recordings
        if: github.event.inputs.dry_run_mode == 'recordings'
        working-directory: auto-poster
        env:
          # MUST match the pipeline job. The dry run's whole purpose is to
          # predict what the real build will do, and takesToRecord() keys off
          # this — without it the dry run expects 12 on-camera takes while the
          # build expects all 36, so it passes with every voiceover take
          # missing and the build then fails. The header of takesToRecord
          # describes this exact disagreement happening once already.
          YT_NARRATION_MODE: peter
          YT_SEGMENTATION_PYTHON: /tmp/segenv/bin/python
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          REQUEST_ID: ${{ github.event.inputs.dry_run_request_id }}
        run: node scripts/fetch-recordings.mjs "$REQUEST_ID" /tmp/dryrun-recordings
      - name: Run the dry run
        working-directory: auto-poster
        env:
          # DELIBERATELY NO METRICOOL CREDENTIALS. The dry run cannot upload
          # because it has nothing to upload with.
          # MUST match the pipeline job. The dry run's whole purpose is to
          # predict what the real build will do, and takesToRecord() keys off
          # this — without it the dry run expects 12 on-camera takes while the
          # build expects all 36, so it passes with every voiceover take
          # missing and the build then fails. The header of takesToRecord
          # describes this exact disagreement happening once already.
          YT_NARRATION_MODE: peter
          YT_SEGMENTATION_PYTHON: /tmp/segenv/bin/python
          # MUST match the pipeline job, for the reason stated twice above and
          # demonstrated twice in production. The dry run exists to predict what
          # the build will do, and the visual mix is now the main thing worth
          # predicting: without these two the dry run reports a
          # typography-only video and the build then produces something else.
          YT_LONGFORM_BROLL_FOLDER: 18wMxgDnPm1HS10k9DTIc-1EijZXhq8RD
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          MODE: ${{ github.event.inputs.dry_run_mode }}
        run: |
          if [ "$MODE" = "recordings" ]; then
            node scripts/dry-run-build.mjs --recordings /tmp/dryrun-recordings --broll /tmp/dryrun-broll
          else
            node scripts/dry-run-build.mjs --synthetic
          fi

  # Rewrite one approved request's outline under the current brief rules, without
  # making Peter pick a topic again. His decision, selection and notes are
  # preserved; only the selected candidate's outline changes. Publishes nothing.
  # Rebuild and re-send a recording kit for a request whose kit already went out
  # — after a narration-mode change, or when the first delivery had no card to
  # open. Clears no acted marker and changes no decision. Publishes nothing.
  # ── WHY STOCK CAME UP EMPTY, WITHOUT RENDERING ANYTHING ───────────────────
  #
  # A build that reports "0/13 windows matched a clip" leaves one question
  # standing: did Pexels return nothing, or did it return clips the vision check
  # rejected? Those have opposite fixes and answering it used to cost a
  # fifty-five minute render.
  #
  # Nothing about the question needs a render. The windows come from the
  # transcript, the queries from the windows, and the rest is network calls. This
  # job runs exactly that much — no takes, no encoding, no upload, no state
  # written — and prints the verdict. Minutes, not an hour.
  stock-probe:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'stock-probe'
    runs-on: ubuntu-latest
    # 60, was 20: the ladder gained the concept rung (a model call and a second
    # fetch per failing window) AND the probe fixture now offers stock to every
    # take, because failed graphics fall to stock in a real build — 38 windows
    # where there were 16. Runs at 20 and at 35 were both cancelled mid-table;
    # the second streamed 24/24 matches before dying at window 25. Budget what
    # the job actually costs. Pexels' 200/hour rate limit is the real ceiling —
    # do not re-dispatch this twice in one hour and trust the second answer.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install ffmpeg
        # fetchStockClip grades every candidate and pulls frames for the vision
        # check, so the probe needs ffmpeg even though it renders no video.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        working-directory: auto-poster
        run: npm install
      - name: Probe the stock ladder
        working-directory: auto-poster
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STOCK_PROBE_QUERIES: ${{ github.event.inputs.stock_queries }}
          # The negative control runs with the sweep so a loosened criterion 3
          # cannot pass unnoticed: it fails the job if a watermarked or
          # wrong-subject clip is ever accepted.
          STOCK_PROBE_CONTROL: 'true'
        run: node scripts/stock-probe.mjs

  # Cut the ~20s vertical teaser for a video that shipped BEFORE the teaser
  # feature existed (video 1 is the reason this job exists). Recovers the
  # takes from Drive via the persisted script, cuts, uploads the teaser to
  # Drive and records it on the log entry — DELIVERY stays with the
  # distribution sweep, so the next pipeline run (or cron) puts it on the
  # Trial tab once it sees the publish flip. Idempotent: an entry that
  # already carries a teaser is left alone.
  teaser-backfill:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'teaser-backfill'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: youtube-longform-approvals
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install ffmpeg & whisper
        run: |
          # ffmpeg cuts and burns; whisper re-transcribes the recovered takes
          # for matching AND stamps the words the caption burn is timed from.
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install openai-whisper --quiet
      - name: Install dependencies
        working-directory: auto-poster
        run: npm install
      - name: Recover takes and cut the teaser
        working-directory: auto-poster
        env:
          # MUST match the pipeline job (see resend-kit's identical note):
          # takesToRecord keys off this, and recovering with the wrong mode
          # would transcribe every voiceover clip into an unmatched stray.
          YT_NARRATION_MODE: peter
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BACKFILL_REQUEST_ID: ${{ github.event.inputs.request_id }}
        run: node scripts/yt-teaser-backfill.mjs
      - name: Commit the teaser record
        if: always()
        working-directory: auto-poster
        run: |
          git config user.name "Auto Poster Bot"
          git config user.email "bot@lifestyle-design.com"
          node merge-log-push.mjs YTTEASER "true"

  resend-kit:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'resend-kit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: youtube-longform-approvals
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: auto-poster
        run: npm install
      - name: Rebuild and re-send the kit
        working-directory: auto-poster
        env:
          # LIVE: sends a real recording kit to the dashboard and Peter's inbox.
          I_UNDERSTAND_THIS_TOUCHES_LIVE: "yes"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          # MUST match the pipeline job. The dry run's whole purpose is to
          # predict what the real build will do, and takesToRecord() keys off
          # this — without it the dry run expects 12 on-camera takes while the
          # build expects all 36, so it passes with every voiceover take
          # missing and the build then fails. The header of takesToRecord
          # describes this exact disagreement happening once already.
          YT_NARRATION_MODE: peter
          YT_SEGMENTATION_PYTHON: /tmp/segenv/bin/python
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_WEBHOOK_SECRET: ${{ secrets.DASHBOARD_WEBHOOK_SECRET }}
          REQUEST_ID: ${{ github.event.inputs.request_id }}
        run: node scripts/resend-kit.mjs "$REQUEST_ID"

  reoutline:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'reoutline'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: youtube-longform-approvals
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: auto-poster
        run: npm install
      - name: Rewrite the outline
        id: run
        working-directory: auto-poster
        env:
          # LIVE: rewrites the stored outline on a real approval record and bills
          # the Anthropic API. The decision itself is never touched.
          I_UNDERSTAND_THIS_TOUCHES_LIVE: "yes"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REQUEST_ID: ${{ github.event.inputs.request_id }}
        run: |
          if node scripts/reoutline-request.mjs "$REQUEST_ID"; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi
      - name: Commit approvals
        if: always()
        working-directory: auto-poster
        run: |
          git config user.name "Auto Poster Bot"
          git config user.email "bot@lifestyle-design.com"
          node merge-log-push.mjs YTREOUTLINE "${{ steps.run.outputs.success }}"

  # One live topic_pick round-trip against the real dashboard, with candidates
  # prefixed [TEST]. Proves the approval endpoint, the push, and the decision
  # coming back with its selection field. Publishes nothing.
  send-test-approval:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'send-test-approval'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: youtube-longform-approvals
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: auto-poster
        run: npm install
      - name: Send the test approval
        id: send
        working-directory: auto-poster
        env:
          # LIVE: raises a real approval card on the dashboard and pushes a
          # notification to Peter. That is the whole point of this job, so the
          # acknowledgement is declared here rather than latched out.
          I_UNDERSTAND_THIS_TOUCHES_LIVE: "yes"
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_WEBHOOK_SECRET: ${{ secrets.DASHBOARD_WEBHOOK_SECRET }}
        run: |
          if node scripts/send-test-approval.mjs; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi
      - name: Commit the request
        if: always()
        working-directory: auto-poster
        run: |
          git config user.name "Auto Poster Bot"
          git config user.email "bot@lifestyle-design.com"
          node merge-log-push.mjs YTTEST "${{ steps.send.outputs.success }}"
