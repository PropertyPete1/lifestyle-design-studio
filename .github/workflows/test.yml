name: Tests

# The auto-poster publishes to live social accounts on a cron. A regression in the
# duplicate guards or the caption safety rules is a business incident, not a failed
# build — so these run on every push and PR that touches the poster.
on:
  push:
    branches: [main]
    paths: ["auto-poster/**", ".github/workflows/test.yml"]
  pull_request:
    paths: ["auto-poster/**", ".github/workflows/test.yml"]

# Stated explicitly rather than inherited. The repo default is currently
# read-only, so this changes nothing today — but that default lives in repo
# settings, outside this file, and flipping it would silently hand write access
# to a workflow that runs unreviewed code from every pull request.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung test file used to sit here for the full six-hour default and then
    # report "fail", which reads exactly like a broken test and is not one. The
    # suite finishes in minutes; anything past 25 is stuck, and finding that out
    # in 25 minutes instead of six hours is the difference between noticing and
    # not. Paired with --test-timeout in `npm test`, which fails the individual
    # test and NAMES it rather than taking the whole job down anonymously.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install ffmpeg
        # The retention-edit tests synthesize real takes and cut real silences —
        # deliberately, because the class of bug this repo pays for most is the
        # one a mock cannot catch (a zoom expression ffmpeg accepts that is
        # secretly a constant; silencedetect output on the wrong stream). Those
        # four tests failed with ENOENT here rather than being skipped, which
        # was correct: a test that silently skips is a test that silently
        # passes.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install dependencies
        working-directory: auto-poster
        run: npm install
      # BEFORE the suite, because it is a second and it catches a class the
      # suite structurally cannot: an identifier that does not exist at a call
      # site only production reaches. See auto-poster/eslint.config.mjs — one
      # rule, no style opinions, currently zero findings.
      - name: Lint for undefined identifiers
        working-directory: auto-poster
        run: npm run lint
      - name: Run test suite
        working-directory: auto-poster
        run: npm test
